name: Tests

on:
  push:
    branches: ["master", "V2"]
  pull_request:
    branches: ["master", "V2"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            requirements-test.txt

      - name: Setup Python
        run: uv python install 3.13

      - name: Create virtual environment
        run: uv venv .venv

      - name: Install test dependencies
        run: uv pip install -r requirements.txt -r requirements-test.txt --python .venv/bin/python

      - name: Compile V2 Python modules
        run: .venv/bin/python -m compileall -q src/backend apps/api evals

      - name: Run tests
        run: .venv/bin/pytest


  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Next.js app
        run: npm run build
