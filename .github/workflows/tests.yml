name: Tests

on:
  push:
    branches: ["master", "Agent"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mathtutor
          POSTGRES_PASSWORD: mathtutor
          POSTGRES_DB: mathtutor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mathtutor -d mathtutor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "requirements-test.txt"

      - name: Setup Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv .venv

      - name: Install test dependencies
        run: uv pip install -r requirements-test.txt --python .venv/bin/python

      - name: Run Tests (pytest)
        run: .venv/bin/pytest