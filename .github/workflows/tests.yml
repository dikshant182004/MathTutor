name: Tests

on:
  push:
    branches: ["master", "V2"]
  pull_request:
    branches: ["master", "V2"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "requirements-test.txt"

      - name: Setup Python
        run: uv python install 3.13

      - name: Create virtual environment
        run: uv venv .venv

      - name: Install test dependencies
        run: uv pip install -r requirements-test.txt --python .venv/bin/python

      - name: Compile V2 Python modules
        run: .venv/bin/python -m compileall -q src/backend/v2 evals

      - name: Run tests
        run: .venv/bin/pytest
