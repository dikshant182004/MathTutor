name: Tests

on:
  push:
    branches: ["master", "Agent"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mathtutor
          POSTGRES_PASSWORD: mathtutor
          POSTGRES_DB: mathtutor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mathtutor -d mathtutor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://mathtutor:mathtutor@localhost:5432/mathtutor

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "requirements-test.txt"

      - name: Setup Python
        run: uv python install 3.14

      - name: Create virtual environment
        run: uv venv .venv --python 3.14

      - name: Install test dependencies
        run: uv pip install -r requirements-test.txt --python .venv/bin/python

      - name: Run Tests (pytest)
        run: .venv/bin/pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install

      - name: Lint Next.js frontend
        run: npm run lint

      - name: Build Next.js frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
        run: npm run build
