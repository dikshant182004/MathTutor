
services:
  postgres:
    image: postgres:16-alpine
    container_name: mathtutor_postgres
    environment:
      POSTGRES_USER: mathtutor
      POSTGRES_PASSWORD: mathtutor
      POSTGRES_DB: mathtutor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathtutor -d mathtutor"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mathtutor_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data_light:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data_light:
